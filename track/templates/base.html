<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thyroid Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'track:home' %}">Thyroid Tracker</a>
        <div>
            {% if user.is_authenticated %}
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'track:symptom_list' %}">Symptoms</a>
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'track:medication_list' %}">Medications</a>
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'track:lab_list' %}">Labs</a>
                <a class="btn btn-outline-danger btn-sm" href="{% url 'users:logout' %}">Log out</a>
            {% else %}
                <a class="btn btn-outline-primary btn-sm" href="{% url 'users:login' %}">Log in</a>
                <a class="btn btn-primary btn-sm" href="{% url 'users:register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mb-5">
    {% block content %}{% endblock %}
</div>

</body>
</html>
