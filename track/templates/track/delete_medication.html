{% extends 'base.html' %}

{% block content %}
    <h1>Delete Medication Entry?</h1>
    <p>{{ medication.date_taken }} at {{ medication.time_taken }}</p>

    <form action="{% url 'track:delete_medication' medication.id %}" method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, Delete</button>
        <a class="btn btn-secondary" href="{% url 'track:medication_list' %}">Cancel</a>
    </form>
{% endblock %}
