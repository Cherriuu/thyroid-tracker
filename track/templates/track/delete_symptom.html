{% extends 'base.html' %}

{% block content %}
    <h1>Delete Symptom?</h1>
    <p>{{ symptom.date_logged }} - {{ symptom.get_symptom_type_display }} ({{ symptom.severity }}/5)</p>

    <form action="{% url 'track:delete_symptom' symptom.id %}" method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, Delete</button>
        <a class="btn btn-secondary" href="{% url 'track:symptom_list' %}">Cancel</a>
    </form>
{% endblock %}
